<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Feedback</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      margin-top:0;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    button{
      margin-top:15px;
      padding:12px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:5px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }

    button:hover{
      background:#0056b3;
    }

    .card{
      border:1px solid #ddd;
      padding:15px;
      border-radius:8px;
      margin-top:15px;
      background:#fafafa;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

  </style>

</head>
<body>

<div class="container">

  <h1>Auto Feedback</h1>

  <h3>Login</h3>

  <input
    type="text"
    id="account"
    placeholder="Account / Username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <select id="zizhangyi">
    <option value="1">
      Zizhangyi
    </option>

    <option value="0">
      Non Zizhangyi
    </option>
  </select>

  <button onclick="login()">
    Login
  </button>

  <div id="loginResult"></div>

  <hr>

  <h3>Tasks</h3>

  <button onclick="loadTasks()">
    Load Tasks
  </button>

  <div id="tasks"></div>

</div>

<script>

let SESSION = "";
let acw_tc = "";

/*
|--------------------------------------------------------------------------
| LOGIN
|--------------------------------------------------------------------------
*/

async function login(){

  try{

    const account =
      document.getElementById(
        "account"
      ).value;

    const password =
      document.getElementById(
        "password"
      ).value;

    const zizhangyi =
      Number(
        document.getElementById(
          "zizhangyi"
        ).value
      );

    /*
    |--------------------------------------------------------------------------
    | REQUEST LOGIN
    |--------------------------------------------------------------------------
    */

    const res = await fetch(
      "/api/auth/login",
      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          account,
          password,
          zizhangyi

        })

      }
    );

    /*
    |--------------------------------------------------------------------------
    | RESPONSE
    |--------------------------------------------------------------------------
    */

    const data =
      await res.json();

    console.log(data);

    const el =
      document.getElementById(
        "loginResult"
      );

    /*
    |--------------------------------------------------------------------------
    | SUCCESS
    |--------------------------------------------------------------------------
    */

    if(data.success){

      /*
      |--------------------------------------------------------------------------
      | GET COOKIES
      |--------------------------------------------------------------------------
      */

      const cookies =
        data.data?.cookies || [];

      SESSION = "";
      acw_tc = "";

      cookies.forEach(cookie => {

        /*
        |--------------------------------------------------------------------------
        | SESSION
        |--------------------------------------------------------------------------
        */

        if(
          cookie.includes("SESSION=")
        ){

          SESSION =
            cookie
              .split("SESSION=")[1]
              .split(";")[0];

        }

        /*
        |--------------------------------------------------------------------------
        | acw_tc
        |--------------------------------------------------------------------------
        */

        if(
          cookie.includes("acw_tc=")
        ){

          acw_tc =
            cookie
              .split("acw_tc=")[1]
              .split(";")[0];

        }

      });

      console.log(
        "SESSION:",
        SESSION
      );

      console.log(
        "acw_tc:",
        acw_tc
      );

      el.innerHTML = `
        <p class="success">
          Login berhasil
        </p>
      `;

    }else{

      /*
      |--------------------------------------------------------------------------
      | FAILED
      |--------------------------------------------------------------------------
      */

      el.innerHTML = `
        <p class="error">
          ${data.message || "Login gagal"}
        </p>
      `;

    }

  }catch(err){

    console.log(err);

    document.getElementById(
      "loginResult"
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

/*
|--------------------------------------------------------------------------
| LOAD TASKS
|--------------------------------------------------------------------------
*/

async function loadTasks(){

  try{

    const res = await fetch(
      "/api/tasks/list",
      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          SESSION,
          acw_tc

        })

      }
    );

    const data =
      await res.json();

    console.log(data);

    const container =
      document.getElementById(
        "tasks"
      );

    container.innerHTML = "";

    /*
    |--------------------------------------------------------------------------
    | FAILED
    |--------------------------------------------------------------------------
    */

    if(!data.success){

      container.innerHTML = `
        <p class="error">
          ${data.message}
        </p>
      `;

      return;
    }

    /*
    |--------------------------------------------------------------------------
    | TASKS
    |--------------------------------------------------------------------------
    */

    data.tasks.forEach(task => {

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <h4>
          ${task.name || "-"}
        </h4>

        <p>
          <b>Task ID:</b>
          ${task.taskId}
        </p>

        <p>
          <b>Address:</b>
          ${task.address || "-"}
        </p>

        <p>
          <b>Phone:</b>
          ${task.phone || "-"}
        </p>

        <input
          type="file"
          accept="image/*"
          id="image-${task.taskId}"
        >

        <input
          type="file"
          accept=".amr,audio/*"
          id="audio-${task.taskId}"
        >

        <select id="feedback-${task.taskId}">

          <option value="149">
            PTP dari user
          </option>

          <option value="150">
            PTP dari keluarga/teman
          </option>

          <option value="151">
            Titip pesan ke keluarga/teman
          </option>

          <option value="154">
            Tidak ada di rumah
          </option>

          <option value="157">
            Tidak ketemu user
          </option>

          <option value="158">
            User tolak bayar
          </option>

          <option value="166">
            Sementara tidak ada uang
          </option>

          <option value="171">
            Pengaruh pandemi
          </option>

          <option value="172">
            Mengajukan restrukturisasi hutang
          </option>

          <option value="206">
            Nasabah tidak mengizinkan recording
          </option>

        </select>

        <textarea
          id="remark-${task.taskId}"
          placeholder="Remark"
        ></textarea>

        <button
          onclick="submitFeedback(
            ${task.taskId},
            ${task.addressId}
          )"
        >
          Submit Feedback
        </button>

        <div id="result-${task.taskId}"></div>

      `;

      container.appendChild(div);

    });

  }catch(err){

    console.log(err);

    document.getElementById(
      "tasks"
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

/*
|--------------------------------------------------------------------------
| SUBMIT FEEDBACK
|--------------------------------------------------------------------------
*/

async function submitFeedback(
  taskId,
  addressId
){

  try{

    const imageFile =
      document.getElementById(
        `image-${taskId}`
      ).files[0];

    const audioFile =
      document.getElementById(
        `audio-${taskId}`
      ).files[0];

    const feedbackId =
      Number(
        document.getElementById(
          `feedback-${taskId}`
        ).value
      );

    const remark =
      document.getElementById(
        `remark-${taskId}`
      ).value;

    const resultEl =
      document.getElementById(
        `result-${taskId}`
      );

    if(!imageFile){

      alert("Upload foto");

      return;
    }

    if(!audioFile){

      alert("Upload audio");

      return;
    }

    const formData =
      new FormData();

    formData.append(
      "image",
      imageFile
    );

    formData.append(
      "audio",
      audioFile
    );

    formData.append(
      "taskId",
      taskId
    );

    formData.append(
      "addressId",
      addressId
    );

    formData.append(
      "feedbackId",
      feedbackId
    );

    formData.append(
      "remark",
      remark
    );

    formData.append(
      "SESSION",
      SESSION
    );

    formData.append(
      "acw_tc",
      acw_tc
    );

    resultEl.innerHTML =
      "Processing...";

    /*
    |--------------------------------------------------------------------------
    | REQUEST
    |--------------------------------------------------------------------------
    */

    const res = await fetch(
      "/api/feedback/submit",
      {

        method:"POST",

        body:formData

      }
    );

    const data =
      await res.json();

    console.log(data);

    /*
    |--------------------------------------------------------------------------
    | SUCCESS
    |--------------------------------------------------------------------------
    */

    if(data.success){

      resultEl.innerHTML = `
        <p class="success">
          Feedback berhasil dikirim
        </p>
      `;

    }else{

      /*
      |--------------------------------------------------------------------------
      | FAILED
      |--------------------------------------------------------------------------
      */

      resultEl.innerHTML = `
        <p class="error">
          ${data.message}
        </p>
      `;

    }

  }catch(err){

    console.log(err);

    document.getElementById(
      `result-${taskId}`
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

</script>

</body>
</html>
