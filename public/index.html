<!-- public/index.html -->

<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Defer Auto Feedback</title>

  <link
    rel="stylesheet"
    href="/style.css"
  />

</head>

<body>

  <div class="container">

    <!-- LOGIN -->

    <div
      class="card login-card"
      id="loginCard"
    >

      <div class="title">
        DFA
      </div>

      <div class="input-group">

        <label>
          Account
        </label>

        <input
          type="text"
          id="account"
          placeholder="Masukkan account"
        >

      </div>

      <div class="input-group">

        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
        >

      </div>

      <div class="input-group">

        <label>
          Login Type
        </label>

        <select id="zizhangyi">

          <option value="1">
            Zizhangyi
          </option>

          <option value="0">
            Non Zizhangyi
          </option>

        </select>

      </div>

      <button
        class="btn-primary"
        onclick="login()"
      >
        Login
      </button>

      <div id="loginResult"></div>

    </div>

    <!-- DASHBOARD -->

    <div
      id="dashboard"
      style="display:none;"
    >

      <!-- NAVBAR -->

      <div class="card">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
          "
        >

          <div class="title">
            Dashboard
          </div>

          <button
            class="logout-btn"
            onclick="logout()"
          >
            Logout
          </button>

        </div>

      </div>

      <!-- TASK -->

      <div class="card">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            flex-wrap:wrap;
            gap:10px;
          "
        >

          <div class="title">
            Data List
          </div>

          <button
            class="btn-primary"
            onclick="loadTasks()"
            style="
              width:auto;
              padding:12px 20px;
            "
          >
            Refresh Data
          </button>

        </div>

        <!-- SEARCH -->

        <div
          style="
            margin-bottom:20px;
          "
        >

          <input
            type="text"
            id="searchTask"
            placeholder="Cari nama / task id / phone / kota..."
            onkeyup="searchTasks()"
            style="
              width:100%;
              padding:14px;
              border-radius:12px;
              border:none;
              outline:none;
              background:#1e293b;
              color:white;
              font-size:15px;
            "
          >

        </div>

        <!-- TOTAL -->

        <div
          id="taskCount"
          style="
            margin-bottom:15px;
            color:#94a3b8;
            font-size:14px;
          "
        ></div>

        <!-- TASKS -->

        <div
          id="tasks"
        ></div>

      </div>

    </div>

  </div>

  <script src="/app.js"></script>

</body>

</html>
