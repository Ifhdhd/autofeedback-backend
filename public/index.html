<!-- public/index.html -->

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Auto Feedback</title>

<link
  rel="stylesheet"
  href="/style.css"
/>

</head>
<body>

<div class="container">

  <!-- LOGIN -->

  <div
    class="card login-card"
    id="loginCard"
  >

    <div class="section-title">
      Auto Feedback Login
    </div>

    <input
      type="text"
      id="account"
      placeholder="Username / Account"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <select id="zizhangyi">

      <option value="1">
        Zizhangyi
      </option>

      <option value="0">
        Non Zizhangyi
      </option>

    </select>

    <button
      class="btn-primary"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginResult"></div>

  </div>

  <!-- DASHBOARD -->

  <div
    id="dashboard"
    style="display:none;"
  >

    <div class="navbar">

      <div class="logo">
        Auto Feedback
      </div>

      <button
        class="btn-danger"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <div class="card">

      <div class="section-title">
        Task List
      </div>

      <button
        class="btn-primary"
        onclick="loadTasks()"
      >
        Refresh Tasks
      </button>

      <div
        class="task-grid"
        id="tasks"
      ></div>

    </div>

  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
