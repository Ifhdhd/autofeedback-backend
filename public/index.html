<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Auto Feedback</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      margin-top:0;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    button{
      margin-top:15px;
      padding:12px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:5px;
      cursor:pointer;
      width:100%;
      font-size:16px;
    }

    button:hover{
      background:#0056b3;
    }

    .card{
      border:1px solid #ddd;
      padding:15px;
      border-radius:8px;
      margin-top:15px;
      background:#fafafa;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

  </style>

</head>
<body>

<div class="container">

  <h1>Auto Feedback</h1>

  <h3>Login</h3>

  <input
    type="text"
    id="account"
    placeholder="Account / Username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <select id="zizhangyi">
    <option value="1">
      Zizhangyi
    </option>

    <option value="0">
      Non Zizhangyi
    </option>
  </select>

  <button onclick="login()">
    Login
  </button>

  <div id="loginResult"></div>

  <hr>

  <h3>Tasks</h3>

  <button onclick="loadTasks()">
    Load Tasks
  </button>

  <div id="tasks"></div>

</div>

<script>

let SESSION = "";
let acw_tc = "";

/*
|--------------------------------------------------------------------------
| LOGIN
|--------------------------------------------------------------------------
*/

async function login(){

  try{

    const account =
      document.getElementById(
        "account"
      ).value;

    const password =
      document.getElementById(
        "password"
      ).value;

    const zizhangyi =
      Number(
        document.getElementById(
          "zizhangyi"
        ).value
      );

    const res = await fetch(
      "/api/auth/login",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          account,
          password,
          zizhangyi
        })

      }
    );

    const data =
      await res.json();

    const el =
      document.getElementById(
        "loginResult"
      );

    if(data.success){

      SESSION =
        data.cookies?.SESSION || "";

      acw_tc =
        data.cookies?.acw_tc || "";

      el.innerHTML = `
        <p class="success">
          Login berhasil
        </p>
      `;

      console.log(
        "SESSION:",
        SESSION
      );

      console.log(
        "acw_tc:",
        acw_tc
      );

    }else{

      el.innerHTML = `
        <p class="error">
          ${data.message || "Login gagal"}
        </p>
      `;

    }

  }catch(err){

    document.getElementById(
      "loginResult"
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

/*
|--------------------------------------------------------------------------
| LOAD TASKS
|--------------------------------------------------------------------------
*/

async function loadTasks(){

  try{

    if(!SESSION){

      alert("Login dulu");

      return;

    }

    const res = await fetch(
      `/tasks?SESSION=${encodeURIComponent(
        SESSION
      )}&acw_tc=${encodeURIComponent(
        acw_tc
      )}`,
      {
        method:"GET"
      }
    );

    const data =
      await res.json();

    const container =
      document.getElementById(
        "tasks"
      );

    container.innerHTML = "";

    if(!data.success){

      container.innerHTML = `
        <p class="error">
          ${data.message}
        </p>
      `;

      return;

    }

    const tasks =
      data.data || [];

    if(tasks.length === 0){

      container.innerHTML = `
        <p>
          Tidak ada task
        </p>
      `;

      return;

    }

    tasks.forEach(task => {

      const div =
        document.createElement(
          "div"
        );

      div.className = "card";

      div.innerHTML = `

        <h3>
          ${task.userName || "-"}
        </h3>

        <p>
          <b>Task ID:</b>
          ${task.id}
        </p>

        <p>
          <b>Case ID:</b>
          ${task.caseId || "-"}
        </p>

        <p>
          <b>Phone:</b>
          ${task.phoneNumber || "-"}
        </p>

        <p>
          <b>Debt:</b>
          Rp ${task.formatDebt || "0"}
        </p>

        <p>
          <b>DPD:</b>
          ${task.dpd || 0}
        </p>

        <p>
          <b>Address:</b>
          ${
            task.addressBo?.street ||
            task.addressBo?.addressDetailLive ||
            "-"
          }
        </p>

        <p>
          <b>Kecamatan:</b>
          ${task.addressBo?.district || "-"}
        </p>

        <p>
          <b>Kota:</b>
          ${task.addressBo?.city || "-"}
        </p>

        <p>
          <b>Provinsi:</b>
          ${task.addressBo?.province || "-"}
        </p>

      `;

      container.appendChild(div);

    });

  }catch(err){

    document.getElementById(
      "tasks"
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

</script>

</body>
</html>
