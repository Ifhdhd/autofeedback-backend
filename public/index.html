<!-- public/index.html -->

<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Auto Feedback JARVIS</title>

  <link
    rel="stylesheet"
    href="/style.css"
  />

</head>

<body>

  <!-- LOADER -->

  <div id="globalLoader">

    <div class="jarvis-ring"></div>

    <div class="loader-text">
      JARVIS LOADING...
    </div>

  </div>

  <div class="container">

    <!-- LOGIN -->

    <div
      class="card login-card"
      id="loginCard"
    >

      <div class="title">
        AUTO FEEDBACK
      </div>

      <div class="input-group">

        <label>
          ACCOUNT
        </label>

        <input
          type="text"
          id="account"
          placeholder="Masukkan account"
        >

      </div>

      <div class="input-group">

        <label>
          PASSWORD
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
        >

      </div>

      <div class="input-group">

        <label>
          LOGIN TYPE
        </label>

        <select id="zizhangyi">

          <option value="1">
            Zizhangyi
          </option>

          <option value="0">
            Non Zizhangyi
          </option>

        </select>

      </div>

      <button
        class="btn-primary"
        onclick="login()"
      >
        LOGIN
      </button>

      <div id="loginResult"></div>

    </div>

    <!-- DASHBOARD -->

    <div
      id="dashboard"
      style="display:none;"
    >

      <!-- NAVBAR -->

      <div class="navbar">

        <div class="logo">
          JARVIS AUTO FEEDBACK
        </div>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

      <!-- TASK -->

      <div class="card">

        <div class="section-title">
          TASK LIST
        </div>

        <!-- SEARCH -->

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Cari nama / task id / address id..."
            onkeyup="filterTasks()"
          >

        </div>

        <button
          class="btn-primary"
          onclick="loadTasks()"
        >
          REFRESH TASKS
        </button>

        <!-- TASK GRID -->

        <div
          id="tasks"
          class="task-grid"
        ></div>

      </div>

    </div>

  </div>

  <script src="/app.js"></script>

</body>
</html>
