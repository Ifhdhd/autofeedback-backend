<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auto Feedback</title>

  <style>

    body{
      font-family:Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:1000px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      margin-top:0;
    }

    .card{
      border:1px solid #ddd;
      border-radius:10px;
      padding:15px;
      margin-top:15px;
      background:#fafafa;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:5px;
      background:#007bff;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#0056b3;
    }

    .success{
      color:green;
    }

    .error{
      color:red;
    }

    .task-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
    }

  </style>

</head>
<body>

<div class="container">

  <h1>Auto Feedback Dashboard</h1>

  <!-- LOGIN -->

  <div class="card">

    <h3>Login</h3>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="loginResult"></div>

  </div>

  <!-- LOAD TASK -->

  <div class="card">

    <h3>Task List</h3>

    <button onclick="loadTasks()">
      Load Task
    </button>

    <div id="taskList"></div>

  </div>

</div>

<script>

/*
|--------------------------------------------------------------------------
| GLOBAL COOKIE
|--------------------------------------------------------------------------
*/

let SESSION = "";
let acw_tc = "";

/*
|--------------------------------------------------------------------------
| LOGIN
|--------------------------------------------------------------------------
*/

async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const resultEl =
    document.getElementById("loginResult");

  if(!username || !password){

    alert("Username dan password wajib");

    return;

  }

  try{

    const res = await fetch("/api/auth/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        password
      })

    });

    const data = await res.json();

    if(data.success){

      SESSION = data.data.SESSION;

      acw_tc = data.data.acw_tc;

      localStorage.setItem(
        "SESSION",
        SESSION
      );

      localStorage.setItem(
        "acw_tc",
        acw_tc
      );

      resultEl.innerHTML = `
        <p class="success">
          Login berhasil
        </p>
      `;

    }else{

      resultEl.innerHTML = `
        <p class="error">
          ${data.message}
        </p>
      `;

    }

  }catch(err){

    resultEl.innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

/*
|--------------------------------------------------------------------------
| LOAD TASKS
|--------------------------------------------------------------------------
*/

async function loadTasks(){

  const container =
    document.getElementById("taskList");

  container.innerHTML =
    "<p>Loading...</p>";

  try{

    SESSION =
      localStorage.getItem("SESSION");

    acw_tc =
      localStorage.getItem("acw_tc");

    if(!SESSION){

      container.innerHTML = `
        <p class="error">
          Silahkan login dulu
        </p>
      `;

      return;

    }

    const res = await fetch(

      `/api/tasks?SESSION=${SESSION}&acw_tc=${acw_tc}`

    );

    const data = await res.json();

    if(!data.success){

      container.innerHTML = `
        <p class="error">
          ${JSON.stringify(data.message)}
        </p>
      `;

      return;

    }

    container.innerHTML = "";

    /*
    |--------------------------------------------------------------------------
    | ALL TASKS
    |--------------------------------------------------------------------------
    */

    data.data.forEach(task => {

      const div =
        document.createElement("div");

      div.className = "card";

      /*
      |--------------------------------------------------------------------------
      | ADDRESS LIST
      |--------------------------------------------------------------------------
      */

      let addressHtml = "";

      if(task.addressList){

        task.addressList.forEach(address => {

          addressHtml += `

            <div
              style="
                border:1px solid #ddd;
                border-radius:10px;
                padding:10px;
                margin-top:10px;
                background:white;
              "
            >

              <p>
                <b>Address ID:</b>
                ${address.id}
              </p>

              <p>
                <b>Nama:</b>
                ${address.name || "-"}
              </p>

              <p>
                <b>Alamat:</b>
                ${address.address || "-"}
              </p>

              <button onclick="
                goToSchedule(
                  '${task.id}',
                  '${address.id}'
                )
              ">
                Schedule Feedback
              </button>

            </div>

          `;

        });

      }

      div.innerHTML = `

        <div class="task-title">
          ${task.name || "No Title"}
        </div>

        <p>
          <b>Task ID:</b>
          ${task.id}
        </p>

        <p>
          <b>Total Address:</b>
          ${task.addressList
            ? task.addressList.length
            : 0}
        </p>

        ${addressHtml}

      `;

      container.appendChild(div);

    });

  }catch(err){

    container.innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

/*
|--------------------------------------------------------------------------
| GO TO SCHEDULE
|--------------------------------------------------------------------------
*/

function goToSchedule(
  taskId,
  addressId
){

  window.location.href =

    `/schedule.html?taskId=${taskId}&addressId=${addressId}`;

}

/*
|--------------------------------------------------------------------------
| AUTO LOAD SESSION
|--------------------------------------------------------------------------
*/

SESSION =
  localStorage.getItem("SESSION") || "";

acw_tc =
  localStorage.getItem("acw_tc") || "";

</script>

</body>
</html>
