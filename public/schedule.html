<!-- public/schedule.html -->

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Schedule</title>

<link
  rel="stylesheet"
  href="/style.css"
/>

<script src="/recorder.js"></script>

</head>
<body>

<div class="container">

  <div class="navbar">

    <div class="logo">
      Schedule Feedback
    </div>

    <button
      class="btn-primary"
      onclick="history.back()"
    >
      Back
    </button>

  </div>

  <div class="card">

    <div class="section-title">
      Informasi Checkin
    </div>

    <div class="info-box">

      <div class="info-item">
        <b>Task ID:</b>
        <span id="showTaskId"></span>
      </div>

      <div class="info-item">
        <b>Address ID:</b>
        <span id="showAddressId"></span>
      </div>

      <div class="info-item">
        <b>Latitude Checkin:</b>
        <span id="showLat"></span>
      </div>

      <div class="info-item">
        <b>Longitude Checkin:</b>
        <span id="showLng"></span>
      </div>

      <div class="info-item">
        <b>Status:</b>
        GPS sesuai rumah nasabah
      </div>

    </div>

    <iframe id="maps"></iframe>

    <input
      type="datetime-local"
      id="scheduleTime"
    >

    <select id="feedbackId">

      <option value="149">
        PTP dari user
      </option>

      <option value="150">
        PTP keluarga
      </option>

      <option value="151">
        Titip pesan
      </option>

      <option value="154">
        Tidak di rumah
      </option>

      <option value="157">
        Tidak ketemu user
      </option>

      <option value="158">
        User menolak bayar
      </option>

      <option value="166">
        Tidak ada uang
      </option>

      <option value="171">
        Pengaruh pandemi
      </option>

      <option value="172">
        Restrukturisasi hutang
      </option>

      <option value="206">
        Menolak recording
      </option>

    </select>

    <textarea
      id="remark"
      placeholder="Remark"
    ></textarea>

    <input
      type="file"
      id="photoFile"
      accept="image/*"
    >

    <img
      id="preview"
      class="preview-image"
      style="display:none;"
    >

    <button
      class="btn-danger"
      onclick="startRecording()"
    >
      Start Recording
    </button>

    <button
      class="btn-primary"
      onclick="stopRecordingCustom()"
    >
      Stop Recording
    </button>

    <div id="recordStatus"></div>

    <audio
      id="previewAudio"
      controls
      style="display:none;"
    ></audio>

    <button
      class="btn-success"
      onclick="saveSchedule()"
    >
      Save Schedule
    </button>

    <div id="result"></div>

  </div>

</div>

<script>

const params =
  new URLSearchParams(
    location.search
  );

const taskId =
  params.get("taskId");

const addressId =
  params.get("addressId");

const lat =
  params.get("lat");

const lng =
  params.get("lng");

document.getElementById(
  "showTaskId"
).innerText = taskId;

document.getElementById(
  "showAddressId"
).innerText = addressId;

document.getElementById(
  "showLat"
).innerText = lat;

document.getElementById(
  "showLng"
).innerText = lng;

document.getElementById(
  "maps"
).src =
  `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;

let recordedBlob = null;

document.getElementById(
  "photoFile"
).onchange = e => {

  const file =
    e.target.files[0];

  if(!file) return;

  const preview =
    document.getElementById(
      "preview"
    );

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

};

async function stopRecordingCustom(){

  const result =
    await recorder.stop();

  recordedBlob =
    result.blob;

  const audio =
    document.getElementById(
      "previewAudio"
    );

  audio.src =
    result.url;

  audio.style.display =
    "block";

  document.getElementById(
    "recordStatus"
  ).innerHTML =
    `<div class="recording">
      Recording selesai
    </div>`;

}

async function saveSchedule(){

  alert(
    "Schedule berhasil dibuat"
  );

}

</script>

</body>
</html>
