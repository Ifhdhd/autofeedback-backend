<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Schedule Feedback</title>

<script src="/recorder.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#1e293b;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
  margin-bottom:20px;
}

h1{
  margin-bottom:20px;
}

h2{
  margin-bottom:15px;
}

.info{
  margin-top:10px;
  font-size:15px;
  line-height:1.6;
}

.label{
  font-weight:bold;
  color:#111827;
}

input,
select,
textarea,
button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin-top:12px;
  font-size:14px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:none;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.success{
  color:green;
  margin-top:15px;
}

.error{
  color:red;
  margin-top:15px;
}

.audio-box{
  margin-top:15px;
}

.photo-preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-top:15px;
}

.badge{
  display:inline-block;
  background:#dbeafe;
  color:#1d4ed8;
  padding:8px 14px;
  border-radius:999px;
  margin-top:10px;
  font-size:13px;
  font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<h1>Schedule Feedback</h1>

<!-- INFO TASK -->

<div class="card">

  <h2>Informasi Checkin</h2>

  <div class="badge">
    Auto Coordinate Enabled
  </div>

  <div class="info">
    <span class="label">
      Task ID:
    </span>

    <span id="taskIdText">
      -
    </span>
  </div>

  <div class="info">
    <span class="label">
      Address ID:
    </span>

    <span id="addressIdText">
      -
    </span>
  </div>

  <div class="info">
    <span class="label">
      Latitude Checkin:
    </span>

    <span id="latitudeText">
      -
    </span>
  </div>

  <div class="info">
    <span class="label">
      Longitude Checkin:
    </span>

    <span id="longitudeText">
      -
    </span>
  </div>

  <div class="info">
    <span class="label">
      Distance:
    </span>

    <span>
      0 Meter
    </span>
  </div>

  <div class="info">
    <span class="label">
      Address:
    </span>

    <div id="addressText">
      -
    </div>
  </div>

</div>

<!-- FORM -->

<div class="card">

  <h2>Buat Schedule</h2>

  <input
    type="datetime-local"
    id="scheduleTime"
  >

  <select id="feedbackId">

    <option value="149">
      PTP dari user
    </option>

    <option value="150">
      PTP dari keluarga / teman
    </option>

    <option value="151">
      Titip pesan ke keluarga / teman
    </option>

    <option value="154">
      Tidak ada di rumah
    </option>

    <option value="157">
      Tidak ketemu user
    </option>

    <option value="158">
      User tolak bayar
    </option>

    <option value="166">
      Sementara tidak ada uang
    </option>

    <option value="171">
      Pengaruh pandemi
    </option>

    <option value="172">
      Mengajukan restrukturisasi hutang
    </option>

    <option value="206">
      Nasabah tidak mengizinkan recording
    </option>

  </select>

  <textarea
    id="remark"
    placeholder="Remark"
  ></textarea>

</div>

<!-- FOTO -->

<div class="card">

  <h2>Upload Foto</h2>

  <input
    type="file"
    id="photoFile"
    accept="image/*"
  >

  <img
    id="photoPreview"
    class="photo-preview"
    style="display:none;"
  >

</div>

<!-- RECORDING -->

<div class="card">

  <h2>Recording</h2>

  <button onclick="startRecording()">
    Start Recording
  </button>

  <button onclick="stopRecording()">
    Stop Recording
  </button>

  <div id="recordStatus"></div>

  <div class="audio-box">

    <audio
      id="previewAudio"
      controls
      style="display:none;width:100%;"
    ></audio>

  </div>

</div>

<!-- SUBMIT -->

<div class="card">

  <button onclick="addSchedule()">
    Tambah Schedule
  </button>

  <div id="result"></div>

</div>

</div>

<script>

/*
|--------------------------------------------------------------------------
| TASK DATA
|--------------------------------------------------------------------------
*/

const task =
  JSON.parse(
    localStorage.getItem(
      "selectedTask"
    ) || "{}"
  );

console.log("TASK:",task);

/*
|--------------------------------------------------------------------------
| ADDRESS DATA
|--------------------------------------------------------------------------
*/

const addressBo =
  task.addressBo || {};

/*
|--------------------------------------------------------------------------
| DATA
|--------------------------------------------------------------------------
*/

const taskId =
  task.id || "-";

const addressId =
  addressBo.id || "-";

const latitude =
  addressBo.latitude || "-";

const longitude =
  addressBo.longitude || "-";

const address =
  addressBo.street ||
  addressBo.addressDetailLive ||
  "-";

/*
|--------------------------------------------------------------------------
| RENDER
|--------------------------------------------------------------------------
*/

document.getElementById(
  "taskIdText"
).innerText = taskId;

document.getElementById(
  "addressIdText"
).innerText = addressId;

document.getElementById(
  "latitudeText"
).innerText = latitude;

document.getElementById(
  "longitudeText"
).innerText = longitude;

document.getElementById(
  "addressText"
).innerText = address;

/*
|--------------------------------------------------------------------------
| PHOTO PREVIEW
|--------------------------------------------------------------------------
*/

document.getElementById(
  "photoFile"
).addEventListener(
  "change",
  function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    const url =
      URL.createObjectURL(file);

    const preview =
      document.getElementById(
        "photoPreview"
      );

    preview.src = url;

    preview.style.display =
      "block";

  }
);

/*
|--------------------------------------------------------------------------
| RECORD
|--------------------------------------------------------------------------
*/

let recordedBlob = null;

async function stopRecording(){

  const result =
    await recorder.stop();

  recordedBlob =
    result.blob;

  const audio =
    document.getElementById(
      "previewAudio"
    );

  audio.src =
    result.url;

  audio.style.display =
    "block";

}

/*
|--------------------------------------------------------------------------
| ADD SCHEDULE
|--------------------------------------------------------------------------
*/

async function addSchedule(){

  try{

    const scheduleTime =
      document.getElementById(
        "scheduleTime"
      ).value;

    const feedbackId =
      document.getElementById(
        "feedbackId"
      ).value;

    const remark =
      document.getElementById(
        "remark"
      ).value;

    const photo =
      document.getElementById(
        "photoFile"
      ).files[0];

    if(!photo){

      alert("Foto wajib");

      return;

    }

    if(!recordedBlob){

      alert("Recording wajib");

      return;

    }

    /*
    |--------------------------------------------------------------------------
    | UPLOAD FOTO
    |--------------------------------------------------------------------------
    */

    const photoForm =
      new FormData();

    photoForm.append(
      "photo",
      photo
    );

    const photoRes =
      await fetch(
        "/upload/photo",
        {
          method:"POST",
          body:photoForm
        }
      );

    const photoData =
      await photoRes.json();

    /*
    |--------------------------------------------------------------------------
    | UPLOAD AUDIO
    |--------------------------------------------------------------------------
    */

    const audioForm =
      new FormData();

    audioForm.append(
      "audio",
      recordedBlob,
      "recording.amr"
    );

    const audioRes =
      await fetch(
        "/upload/audio",
        {
          method:"POST",
          body:audioForm
        }
      );

    const audioData =
      await audioRes.json();

    /*
    |--------------------------------------------------------------------------
    | SAVE
    |--------------------------------------------------------------------------
    */

    const res =
      await fetch(
        "/schedules/add",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            taskId,
            addressId,

            latitude,
            longitude,

            scheduleTime,
            feedbackId,
            remark,

            address,

            photoPath:
              photoData.path,

            audioPath:
              audioData.path

          })

        }
      );

    const data =
      await res.json();

    const result =
      document.getElementById(
        "result"
      );

    if(data.success){

      result.innerHTML = `
        <p class="success">
          Schedule berhasil dibuat
        </p>
      `;

    }else{

      result.innerHTML = `
        <p class="error">
          ${data.message}
        </p>
      `;

    }

  }catch(err){

    document.getElementById(
      "result"
    ).innerHTML = `
      <p class="error">
        ${err.message}
      </p>
    `;

  }

}

</script>

</body>
</html>
