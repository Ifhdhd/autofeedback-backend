<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Schedule Feedback</title>

<script src="/recorder.js"></script>

<style>

body{
  font-family:Arial;
  background:#f4f4f4;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  box-sizing:border-box;
}

.card{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.success{
  color:green;
}

.error{
  color:red;
}

</style>

</head>
<body>

<div class="container">

<h1>Schedule Feedback</h1>

<div class="card">

<input type="text" id="taskId" placeholder="Task ID">

<input type="text" id="addressId" placeholder="Address ID">

<input type="datetime-local" id="scheduleTime">

<select id="feedbackId">

<option value="149">PTP</option>
<option value="150">Keluarga</option>
<option value="154">Tidak di rumah</option>

</select>

<h3>Upload Foto</h3>

<input type="file" id="photoFile" accept="image/*">

<h3>Recording</h3>

<button onclick="startRecording()">
Start Recording
</button>

<button onclick="stopRecording()">
Stop Recording
</button>

<div id="recordStatus"></div>

<audio id="previewAudio" controls style="display:none;"></audio>

<button onclick="addSchedule()">
Tambah Jadwal
</button>

<div id="result"></div>

</div>

</div>

<script>

let recordedBlob = null;

async function stopRecording(){

  const result = await recorder.stop();

  recordedBlob = result.blob;

  const audio =
    document.getElementById("previewAudio");

  audio.src = result.url;

  audio.style.display = "block";

}

async function addSchedule(){

  try{

    const taskId =
      document.getElementById("taskId").value;

    const addressId =
      document.getElementById("addressId").value;

    const scheduleTime =
      document.getElementById("scheduleTime").value;

    const feedbackId =
      document.getElementById("feedbackId").value;

    const photo =
      document.getElementById("photoFile").files[0];

    if(!photo){

      alert("Foto wajib");

      return;

    }

    if(!recordedBlob){

      alert("Recording wajib");

      return;

    }

    /*
    |--------------------------------------------------------------------------
    | UPLOAD FOTO
    |--------------------------------------------------------------------------
    */

    const photoForm = new FormData();

    photoForm.append("photo", photo);

    const photoRes =
      await fetch("/upload/photo",{
        method:"POST",
        body:photoForm
      });

    const photoData =
      await photoRes.json();

    /*
    |--------------------------------------------------------------------------
    | UPLOAD AUDIO
    |--------------------------------------------------------------------------
    */

    const audioForm = new FormData();

    audioForm.append(
      "audio",
      recordedBlob,
      "recording.amr"
    );

    const audioRes =
      await fetch("/upload/audio",{
        method:"POST",
        body:audioForm
      });

    const audioData =
      await audioRes.json();

    /*
    |--------------------------------------------------------------------------
    | SAVE SCHEDULE
    |--------------------------------------------------------------------------
    */

    const res = await fetch("/schedules/add",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        taskId,
        addressId,
        scheduleTime,
        feedbackId,

        photoPath:
          photoData.path,

        audioPath:
          audioData.path

      })

    });

    const data = await res.json();

    const result =
      document.getElementById("result");

    if(data.success){

      result.innerHTML =
        `<p class="success">
          Jadwal berhasil dibuat
        </p>`;

    }else{

      result.innerHTML =
        `<p class="error">
          ${data.message}
        </p>`;

    }

  }catch(err){

    alert(err.message);

  }

}

</script>

</body>
</html>
